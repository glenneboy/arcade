<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05040c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Neon Pong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05040c;
    --p0: #2ef6ff;
    --p1: #ff3dd8;
    --ink: #eef1ff;
    --dim: #8a8fb3;
    --panel: rgba(14, 12, 32, 0.82);
    --line: rgba(255, 255, 255, 0.12);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; }

  .screen {
    position: fixed; inset: 0; display: none; z-index: 5;
    align-items: center; justify-content: center; flex-direction: column;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    background: radial-gradient(120% 80% at 50% 30%, rgba(40, 20, 90, 0.55), rgba(5, 4, 12, 0.9));
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    text-align: center; gap: 14px;
  }
  .screen.on { display: flex; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: scale(.98); } to { opacity: 1; transform: none; } }

  h1 {
    font-family: Orbitron, system-ui, sans-serif; font-weight: 800; margin: 0 0 6px;
    font-size: clamp(44px, 16vw, 84px); letter-spacing: .06em; line-height: 1;
    background: linear-gradient(90deg, var(--p0), #b48cff 50%, var(--p1));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(120, 140, 255, .55));
  }
  h2 { font-family: Orbitron, system-ui, sans-serif; font-weight: 800; margin: 0; font-size: clamp(28px, 9vw, 44px); letter-spacing: .05em; }
  .sub { color: var(--dim); font-size: 14px; margin: -6px 0 10px; letter-spacing: .08em; text-transform: uppercase; }
  .stack { display: flex; flex-direction: column; gap: 12px; width: min(340px, 100%); }
  .row { display: flex; gap: 10px; width: 100%; }

  button, .btn {
    appearance: none; border: 1px solid var(--line); border-radius: 14px;
    background: var(--panel); color: var(--ink); font: 600 17px/1 system-ui, sans-serif;
    padding: 17px 18px; cursor: pointer; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: transform .08s ease, border-color .2s, box-shadow .2s; letter-spacing: .02em;
  }
  button:active, .btn:active { transform: scale(.97); }
  button.primary { border-color: rgba(46, 246, 255, .6); box-shadow: 0 0 22px rgba(46, 246, 255, .22), inset 0 0 14px rgba(46, 246, 255, .12); }
  button.pink { border-color: rgba(255, 61, 216, .6); box-shadow: 0 0 22px rgba(255, 61, 216, .22), inset 0 0 14px rgba(255, 61, 216, .12); }
  button.ghost { background: transparent; color: var(--dim); }
  button:disabled { opacity: .45; }
  .tag { font-size: 12px; color: var(--dim); font-weight: 500; }

  .divider { display: flex; align-items: center; gap: 10px; color: var(--dim); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; margin: 4px 0; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  input.code {
    flex: 1; min-width: 0; font: 800 24px/1 Orbitron, system-ui, sans-serif; letter-spacing: .3em; text-align: center; text-transform: uppercase;
    background: rgba(0,0,0,.35); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 14px 8px;
    -webkit-user-select: text; user-select: text; touch-action: manipulation;
  }
  input.code:focus { outline: none; border-color: var(--p1); box-shadow: 0 0 18px rgba(255, 61, 216, .3); }

  .bigcode { font: 800 clamp(48px, 18vw, 76px)/1 Orbitron, system-ui, sans-serif; letter-spacing: .18em; padding-left: .18em; color: var(--p0); text-shadow: 0 0 22px rgba(46, 246, 255, .6); }
  .msg { color: var(--dim); font-size: 15px; min-height: 1.3em; max-width: 340px; }
  .msg.err { color: #ff7a8a; }
  .dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

  .hud { position: fixed; z-index: 4; top: max(10px, env(safe-area-inset-top)); left: 10px; display: none; gap: 8px; }
  .hud.on { display: flex; }
  .hud button { padding: 10px 12px; font-size: 15px; border-radius: 12px; background: rgba(14,12,32,.55); }
  .net { align-self: center; font-size: 12px; color: var(--dim); letter-spacing: .06em; }
  .toast {
    position: fixed; z-index: 6; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; font-weight: 600;
    display: none; pointer-events: none; max-width: calc(100% - 32px);
  }
  .toast.on { display: block; }
  .back { color: var(--dim); font-size: 14px; text-decoration: none; margin-top: 8px; }
  .help { color: var(--dim); font-size: 13px; line-height: 1.45; max-width: 340px; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud" id="hud">
  <button id="btnPause" aria-label="Menu">❚❚</button>
  <button id="btnMute" aria-label="Toggle sound">🔊</button>
  <span class="net" id="netMode"></span>
</div>
<div class="toast" id="toast"></div>

<!-- Main menu -->
<section class="screen on" id="scrMenu">
  <h1>PONG</h1>
  <div class="sub">Neon edition</div>
  <div class="stack">
    <button class="primary" data-act="solo">Play vs CPU</button>
    <button data-act="local">2 Players · this device</button>
    <div class="divider">2 phones</div>
    <button class="pink" data-act="host">Host online game</button>
    <div class="row">
      <input class="code" id="joinCode" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text">
      <button class="pink" data-act="join" id="btnJoin">Join</button>
    </div>
    <div class="msg" id="menuMsg"></div>
  </div>
  <a class="back" href="../">← Arcade</a>
</section>

<!-- Pause -->
<section class="screen" id="scrPause">
  <h2>PAUSED</h2>
  <div class="stack">
    <button class="primary" data-act="resume" id="btnResume">Resume</button>
    <button data-act="menu">Quit to menu</button>
  </div>
</section>

<!-- Host lobby -->
<section class="screen" id="scrLobby">
  <div class="sub">Room code</div>
  <div class="bigcode" id="lobbyCode">····</div>
  <div class="msg" id="lobbyMsg"><span class="dots">Setting up</span></div>
  <div class="stack">
    <button class="primary" data-act="share" id="btnShare">Share invite link</button>
    <button class="ghost" data-act="menu">Cancel</button>
  </div>
  <p class="help">On the other phone, open this page and enter the code — or just open the invite link.</p>
</section>

<!-- Joining -->
<section class="screen" id="scrJoin">
  <h2 id="joinTitle">JOINING</h2>
  <div class="msg"><span class="dots">Connecting</span></div>
  <div class="stack"><button class="ghost" data-act="menu">Cancel</button></div>
</section>

<!-- Game over -->
<section class="screen" id="scrOver">
  <h2 id="overTitle">YOU WIN</h2>
  <div class="bigcode" id="overScore" style="font-size:clamp(36px,12vw,56px)">7 – 3</div>
  <div class="msg" id="overMsg"></div>
  <div class="stack">
    <button class="primary" data-act="rematch" id="btnRematch">Rematch</button>
    <button data-act="menu">Menu</button>
  </div>
</section>

<script src="../lib/mqtt.min.js"></script>
<script src="../lib/peerjs.min.js"></script>
<script type="module" src="pong.js"></script>
</body>
</html>
